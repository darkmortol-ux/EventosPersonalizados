# ==========================================================
#  Configuración de Eventos Personalizados
#  Todos los "interval-minutes" están en minutos reales.
#  "duration-seconds" es la duración del evento una vez activo.
# ==========================================================

broadcast-events: true   # Anunciar por chat cuando empieza/termina un evento

meteor-shower:
  enabled: true
  interval-minutes: 45
  duration-seconds: 60
  meteors-per-second: 2       # cuántos meteoros caen por segundo
  radius: 40                  # radio alrededor de cada jugador donde pueden caer
  explosion-power: 3.0
  set-fire: true

mob-invasion:
  enabled: true
  interval-minutes: 60
  duration-seconds: 90
  mob-count: 20                # cantidad total de mobs que aparecen
  spawn-radius: 25             # radio alrededor de cada jugador
  mob-types:
    - ZOMBIE
    - SKELETON
    - SPIDER
    - HUSK

eternal-night:
  enabled: true
  interval-minutes: 90
  duration-seconds: 300
  buff-mobs: true               # mobs más fuertes durante el evento
  bonus-xp: 5                   # XP extra por cada mob matado durante el evento
  loot-table:
    - ROTTEN_FLESH
    - IRON_INGOT
    - EMERALD
    - GOLDEN_APPLE

toxic-storm:
  enabled: true
  interval-minutes: 50
  duration-seconds: 60
  damage-per-tick: 1.0
  tick-interval-seconds: 3
  only-outdoors: true           # solo afecta a jugadores sin techo sobre su cabeza

supreme-chest:
  enabled: true
  interval-minutes: 70
  max-distance: 1000                    # distancia máxima en bloques desde la coordenada 0,0 donde puede aparecer
  time-limit-minutes: 10                # minutos para encontrarlo y abrirlo antes de que desaparezca
  reminder-interval-minutes: 2          # cada cuántos minutos se recuerdan las coordenadas por chat
  final-warning-minutes: 2              # últimos X minutos donde se avisa que está por desaparecer
  final-warning-interval-seconds: 30    # cada cuántos segundos se repite ese aviso final
  opened-cleanup-seconds: 120           # si alguien abre el cofre pero no lo cierra, desaparece solo tras estos segundos
  # "chance": 10.0 = 100% de probabilidad de aparecer, 5.0 = 50%, 1.0 = 10%, hasta 0.05 = 0.5%
  # (el mínimo). Cada item se sortea de forma INDEPENDIENTE: pueden salir varios a la vez,
  # uno solo (el cofre nunca queda vacío: si todos fallan, se agrega el de mayor chance). Ajusta "min"/"max" (cantidad) y
  # "chance" (probabilidad) a tu gusto.
  loot:
    - item: NETHERITE_INGOT
      min: 1
      max: 1
      chance: 0.5
    - item: NETHERITE_SCRAP
      min: 1
      max: 2
      chance: 1.0
    - item: DIAMOND
      min: 3
      max: 8
      chance: 4.0
    - item: DIAMOND_BLOCK
      min: 1
      max: 2
      chance: 0.8
    - item: EMERALD
      min: 5
      max: 15
      chance: 6.0
    - item: GOLDEN_APPLE
      min: 2
      max: 4
      chance: 3.0
    - item: ENCHANTED_GOLDEN_APPLE
      min: 1
      max: 1
      chance: 0.3
    - item: TOTEM_OF_UNDYING
      min: 1
      max: 1
      chance: 0.2
    - item: ELYTRA
      min: 1
      max: 1
      chance: 0.05
    - item: EXPERIENCE_BOTTLE
      min: 8
      max: 20
      chance: 5.0
    - item: IRON_INGOT
      min: 5
      max: 12
      chance: 7.0
    - item: GOLD_INGOT
      min: 5
      max: 10
      chance: 6.0
    - item: OBSIDIAN
      min: 4
      max: 8
      chance: 4.0
    - item: ANCIENT_DEBRIS
      min: 1
      max: 2
      chance: 0.6
    - item: SHULKER_SHELL
      min: 1
      max: 1
      chance: 0.4
    - item: ENDER_PEARL
      min: 2
      max: 5
      chance: 3.5
    - item: SADDLE
      min: 1
      max: 1
      chance: 1.5
    - item: NAME_TAG
      min: 1
      max: 1
      chance: 1.0
    - item: ARROW
      min: 16
      max: 32
      chance: 5.0
    - item: TNT
      min: 2
      max: 4
      chance: 2.0

random-boss:
  enabled: true
  interval-minutes: 120
  min-players: 3
  boss-health: 200.0
  boss-damage: 8.0
  duration-seconds: 900         # tiempo máximo para derrotarlo; si se acaba, el jefe escapa y el evento termina
  reward-money: 500             # requiere plugin de economía (Vault) opcional
  reward-items:
    - item: NETHERITE_SCRAP
      min: 1
      max: 2
    - item: DIAMOND
      min: 5
      max: 10

  # ------------------------------------------------------------------
  #  Integración con SistemaClases: al derrotar al jefe, quien le da el golpe final recibe
  #  1 esencia de clase elegida por porcentaje. SistemaClases hace la entrega real mediante
  #  un comando de consola, así este plugin no depende de él al compilar.
  #
  #  PASOS PARA ACTIVARLO:
  #   1. Pon en "command" el comando EXACTO de SistemaClases que entrega una esencia
  #      ({player} = jugador, {class} = el "id" de la esencia sorteada).
  #   2. Pon en cada "id" el nombre de la clase tal como lo espera ese comando.
  #   3. Prueba con  /eventos esencia <jugador>  (no hace falta matar al jefe).
  #   4. Cuando funcione, cambia "enabled" a true.
  # ------------------------------------------------------------------
  sistema-clases:
    enabled: false                # IMPORTANTE: déjalo en false hasta que la prueba del paso 3 funcione
    plugin-name: SistemaClases    # nombre del plugin.yml (name:), NO el del repositorio de GitHub
    drop-chance: 100.0            # % de que el jefe suelte una esencia al morir (100 = siempre suelta 1)
    command: "clases esencia dar {player} {class}"   # EJEMPLO: cámbialo por el comando real, sin "/"
    # Se elige exactamente 1 de las 6. "chance" es el porcentaje relativo de cada una;
    # si suman 100 se leen como porcentajes exactos (admite decimales, ej. 0.5).
    essences:
      - id: guerrero
        name: Guerrero
        chance: 17
      - id: mago
        name: Mago
        chance: 17
      - id: arquero
        name: Arquero
        chance: 17
      - id: tanque
        name: Tanque
        chance: 17
      - id: asesino
        name: Asesino
        chance: 16
      - id: clerigo
        name: Clérigo
        chance: 16



